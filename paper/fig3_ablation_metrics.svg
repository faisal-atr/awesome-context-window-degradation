<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#ffffff" />
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">Figure 3: Breakdown Across Five Synthesis Dimensions (Eq. 4)</text>
  <text x="400" y="52" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4b5563">Accuracy (A), Coverage (C), Provenance (P), Integration (I), Uncertainty (U)</text>

  <!-- Dimensions along X: A (150), C (270), P (390), I (510), U (630) -->
  <!-- Legend at top right -->
  <rect x="470" y="65" width="270" height="30" fill="#f8fafc" stroke="#e2e8f0" rx="4" />
  <rect x="480" y="75" width="12" height="10" fill="#dc2626" />
  <text x="496" y="84" font-family="Arial, sans-serif" font-size="10" fill="#111827">Naive</text>
  <rect x="535" y="75" width="12" height="10" fill="#d97706" />
  <text x="551" y="84" font-family="Arial, sans-serif" font-size="10" fill="#111827">Reordered</text>
  <rect x="610" y="75" width="12" height="10" fill="#6366f1" />
  <text x="626" y="84" font-family="Arial, sans-serif" font-size="10" fill="#111827">ECIS (NoAudit)</text>
  <rect x="695" y="75" width="12" height="10" fill="#059669" />
  <text x="711" y="84" font-family="Arial, sans-serif" font-size="10" fill="#111827">ECIS (Full)</text>

  <!-- Baseline Grid Lines (Y: 100 to 360, 260px range for 0 to 1.0) -->
  <line x1="80" y1="100" x2="740" y2="100" stroke="#e5e7eb" stroke-dasharray="4" />
  <line x1="80" y1="165" x2="740" y2="165" stroke="#e5e7eb" stroke-dasharray="4" />
  <line x1="80" y1="230" x2="740" y2="230" stroke="#e5e7eb" stroke-dasharray="4" />
  <line x1="80" y1="295" x2="740" y2="295" stroke="#e5e7eb" stroke-dasharray="4" />
  <line x1="80" y1="360" x2="740" y2="360" stroke="#111827" stroke-width="2" />

  <text x="70" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#374151">1.0</text>
  <text x="70" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#374151">0.75</text>
  <text x="70" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#374151">0.50</text>
  <text x="70" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#374151">0.25</text>
  <text x="70" y="365" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#374151">0.00</text>

  <!-- Metric Clusters: -->
  <!-- A: Naive=0.567 (h=147, y=213), Reorder=0.738 (h=192, y=168), NoAudit=0.873 (h=227, y=133), Full=0.901 (h=234, y=126) -->
  <g transform="translate(100,0)">
    <rect x="0" y="213" width="18" height="147" fill="#dc2626" rx="2" />
    <rect x="20" y="168" width="18" height="192" fill="#d97706" rx="2" />
    <rect x="40" y="133" width="18" height="227" fill="#6366f1" rx="2" />
    <rect x="60" y="126" width="18" height="234" fill="#059669" rx="2" />
    <text x="39" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Accuracy (A)</text>
    <text x="69" y="120" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#059669">0.90</text>
  </g>

  <!-- C: Naive=0.554 (h=144, y=216), Reorder=0.714 (h=186, y=174), NoAudit=0.873 (h=227, y=133), Full=0.892 (h=232, y=128) -->
  <g transform="translate(230,0)">
    <rect x="0" y="216" width="18" height="144" fill="#dc2626" rx="2" />
    <rect x="20" y="174" width="18" height="186" fill="#d97706" rx="2" />
    <rect x="40" y="133" width="18" height="227" fill="#6366f1" rx="2" />
    <rect x="60" y="128" width="18" height="232" fill="#059669" rx="2" />
    <text x="39" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Coverage (C)</text>
    <text x="69" y="122" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#059669">0.89</text>
  </g>

  <!-- P: Naive=0.551 (h=143, y=217), Reorder=0.663 (h=172, y=188), NoAudit=0.917 (h=238, y=122), Full=0.931 (h=242, y=118) -->
  <g transform="translate(360,0)">
    <rect x="0" y="217" width="18" height="143" fill="#dc2626" rx="2" />
    <rect x="20" y="188" width="18" height="172" fill="#d97706" rx="2" />
    <rect x="40" y="122" width="18" height="238" fill="#6366f1" rx="2" />
    <rect x="60" y="118" width="18" height="242" fill="#059669" rx="2" />
    <text x="39" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Provenance (P)</text>
    <text x="69" y="112" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#059669">0.93</text>
  </g>

  <!-- I: Naive=0.477 (h=124, y=236), Reorder=0.646 (h=168, y=192), NoAudit=0.682 (h=177, y=183), Full=0.865 (h=225, y=135) -->
  <g transform="translate(490,0)">
    <rect x="0" y="236" width="18" height="124" fill="#dc2626" rx="2" />
    <rect x="20" y="192" width="18" height="168" fill="#d97706" rx="2" />
    <rect x="40" y="183" width="18" height="177" fill="#6366f1" rx="2" />
    <rect x="60" y="135" width="18" height="225" fill="#059669" rx="2" />
    <text x="39" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Integration (I)</text>
    <text x="69" y="129" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#059669">0.87</text>
    <text x="49" y="177" font-family="Arial, sans-serif" font-size="9" fill="#4338ca">-21% audit gap</text>
  </g>

  <!-- U: Naive=0.450 (h=117, y=243), Reorder=0.606 (h=158, y=202), NoAudit=0.634 (h=165, y=195), Full=0.843 (h=219, y=141) -->
  <g transform="translate(620,0)">
    <rect x="0" y="243" width="18" height="117" fill="#dc2626" rx="2" />
    <rect x="20" y="202" width="18" height="158" fill="#d97706" rx="2" />
    <rect x="40" y="195" width="18" height="165" fill="#6366f1" rx="2" />
    <rect x="60" y="141" width="18" height="219" fill="#059669" rx="2" />
    <text x="39" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Uncertainty (U)</text>
    <text x="69" y="135" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#059669">0.84</text>
    <text x="49" y="189" font-family="Arial, sans-serif" font-size="9" fill="#4338ca">-25% caveat gap</text>
  </g>
</svg>