<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#ffffff" />
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Figure 2: Positional Bias Profile ("Lost in the Middle")</text>
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4b5563">Effect of evidence location across document context (8K-32K token regimes)</text>
  
  <!-- Grid Lines -->
  <line x1="100" y1="90" x2="720" y2="90" stroke="#e5e7eb" stroke-dasharray="4" />
  <line x1="100" y1="170" x2="720" y2="170" stroke="#e5e7eb" stroke-dasharray="4" />
  <line x1="100" y1="250" x2="720" y2="250" stroke="#e5e7eb" stroke-dasharray="4" />
  <line x1="100" y1="330" x2="720" y2="330" stroke="#e5e7eb" stroke-dasharray="4" />
  <line x1="100" y1="410" x2="720" y2="410" stroke="#111827" stroke-width="2" />
  
  <!-- Y Axis -->
  <line x1="100" y1="90" x2="100" y2="410" stroke="#111827" stroke-width="2" />
  <text x="85" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">1.0</text>
  <text x="85" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">0.8</text>
  <text x="85" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">0.6</text>
  <text x="85" y="335" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">0.4</text>
  <text x="85" y="415" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">0.2</text>
  <text x="45" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827" transform="rotate(-90 45 250)">Composite Quality (Q)</text>

  <!-- X Axis: Beginning (140), Early 25% (275), Middle 50% (410), Late 75% (545), End (680) -->
  <text x="140" y="435" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Beginning (0-10%)</text>
  <text x="275" y="435" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Early (25%)</text>
  <text x="410" y="435" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Middle (50%)</text>
  <text x="545" y="435" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Late (75%)</text>
  <text x="680" y="435" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">End (90-100%)</text>
  <text x="410" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Relative Evidence Position in Context</text>

  <!-- Naive U-Shape: [0.623, 0.505, 0.347, 0.500, 0.621] -->
  <!-- y = 410 - (val - 0.2) / 0.8 * 320 -->
  <!-- 0.623: 240.8, 0.505: 288.0, 0.347: 351.2, 0.500: 290.0, 0.621: 241.6 -->
  <path d="M 140,241 Q 410,360 680,242" fill="none" stroke="#dc2626" stroke-width="3.5" />
  <circle cx="140" cy="241" r="5" fill="#dc2626" />
  <circle cx="275" cy="288" r="5" fill="#dc2626" />
  <circle cx="410" cy="351" r="6" fill="#dc2626" />
  <circle cx="545" cy="290" r="5" fill="#dc2626" />
  <circle cx="680" cy="242" r="5" fill="#dc2626" />
  <text x="410" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#dc2626">Middle Dip: -44.2%</text>

  <!-- Reordered: [0.686, 0.674, 0.651, 0.670, 0.684] -->
  <!-- 0.686: 215.6, 0.674: 220.4, 0.651: 229.6, 0.670: 222.0, 0.684: 216.4 -->
  <polyline points="140,216 275,220 410,230 545,222 680,216" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="6,4" />
  <circle cx="140" cy="216" r="5" fill="#d97706" />
  <circle cx="275" cy="220" r="5" fill="#d97706" />
  <circle cx="410" cy="230" r="5" fill="#d97706" />
  <circle cx="545" cy="222" r="5" fill="#d97706" />
  <circle cx="680" cy="216" r="5" fill="#d97706" />

  <!-- ECIS Proposed: Flat at ~0.886 (y = 135.6) -->
  <line x1="140" y1="136" x2="680" y2="136" stroke="#059669" stroke-width="4" />
  <circle cx="140" cy="136" r="6" fill="#059669" />
  <circle cx="275" cy="135" r="6" fill="#059669" />
  <circle cx="410" cy="136" r="6" fill="#059669" />
  <circle cx="545" cy="135" r="6" fill="#059669" />
  <circle cx="680" cy="136" r="6" fill="#059669" />
  <text x="410" y="120" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#059669">ECIS Invariant Profile (Δ = 0.2%)</text>
  
  <!-- Callout annotation -->
  <rect x="470" y="270" width="220" height="45" fill="#fef2f2" stroke="#f87171" rx="4" />
  <text x="580" y="288" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#991b1b">Severe attention attenuation</text>
  <text x="580" y="304" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#991b1b">in naive single-pass context</text>
</svg>